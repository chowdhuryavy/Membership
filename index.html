    <meta name="application-name" content="Health Club">
    
    <!-- Web App Manifest -->
    <link rel="manifest" id="pwa-manifest" href="/manifest.json" />
    
    
    <script>
      // Handle clean URL redirect for staff-login
      const urlParams = new URLSearchParams(window.location.search);
      const isStaffPath = window.location.pathname === '/staff-login' || window.location.pathname.endsWith('/staff-login');
      const isStaffPortalParam = urlParams.get('portal') === 'staff';
      const isStaffHash = window.location.hash.includes('staff-login') || window.location.hash.includes('staff-dashboard') || window.location.hash.includes('staff-schedule');
      let isStaffPreferred = false;
      try {
        if (localStorage.getItem('preferred_portal') === 'staff') {
           // Only consider storage preference if we are booting up at the root with no explicit path
           // this prevents overriding deliberate attempts to go to the admin login
           if (!window.location.hash || window.location.hash === '#/' || window.location.hash === '' || window.location.hash.includes('staff')) {
             isStaffPreferred = true;
           }
        }
      } catch (e) {}
      
      const isStaffPortal = isStaffPath || isStaffPortalParam || isStaffHash || isStaffPreferred;

      if (isStaffPortal) {
        // Swap manifest for Staff Portal (Critical for iPhone)
        const manifestLink = document.getElementById('pwa-manifest');
        if (manifestLink) {
          manifestLink.setAttribute('href', '/manifest-staff.json');
        }
        
        // Ensure ?portal=staff is in the URL so iOS "Add to Home Screen" saves it
        if (!isStaffPortalParam) {
          urlParams.set('portal', 'staff');
          window.history.replaceState(null, '', '?' + urlParams.toString() + window.location.hash);
        }

        // Only redirect if we are not already on the hash route
        if (!window.location.hash.includes('staff-login') && !window.location.hash.includes('staff-dashboard')) {
          window.location.replace(window.location.origin + window.location.pathname + '?portal=staff#/staff-login');
        }
      }

      // Handle chunk load errors (common in SPAs when a new version is deployed)
      window.addEventListener('error', (e) => {
        if (e.message && (e.message.includes('chunk') || e.message.includes('Loading chunk'))) {
          console.warn('Chunk load error detected, reloading...', e);
          window.location.reload();
        }
      }, true);
    </script>
</head>
