
<!DOCTYPE html>

    <style>
      body {
        color: #0f172a;
        background-color: #f8fafc;
        margin: 0;
        padding: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
      }
      @media print {
        html, body {
          height: auto !important;
          overflow: visible !important;
          background: white !important;
        }
        #root {
          height: auto !important;
          overflow: visible !important;
        }
      }
    </style>
    <link rel="stylesheet" href="/index.css" />
    
    <!-- Favicon Tags -->
    <link rel="icon" type="image/png" href="/favicon-32x32.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/apple-touch-icon.png" />
    <link rel="icon" sizes="192x192" href="/pwa-192x192.png" />
    
    <meta name="theme-color" content="#4f46e5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Health Club Managements">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="application-name" content="Health Club Managements">
    <title>Health Club Managements</title>
    
    <!-- Web App Manifest -->
    <link rel="manifest" id="pwa-manifest" href="/manifest.json" />
    
    <script>
      // Immediately set dynamic manifest & title based on route/hostname
      const host = window.location.hostname.toLowerCase();
      const urlParams = new URLSearchParams(window.location.search);
      const isStaff = window.location.pathname.includes('/staff') || window.location.hash.includes('staff') || host.includes('hcm-staff') || urlParams.get('portal') === 'staff';
      const isGuest = window.location.pathname.includes('/guest') || window.location.hash.includes('guest') || host.includes('hcm-guest') || urlParams.get('portal') === 'guest';
      
      const manifestLink = document.getElementById('pwa-manifest');
      if (manifestLink) {
        if (isStaff) {
          manifestLink.setAttribute('href', '/manifest-staff.json');
        } else if (isGuest) {
          manifestLink.setAttribute('href', '/manifest-guest.json');
        } else {
          manifestLink.setAttribute('href', '/manifest.json');
        }
      }

      const pwaTitle = isStaff ? "HCM - Staff Portal" : isGuest ? "HCM - Guest Portal" : "Health Club Managements";
      document.title = pwaTitle;
      
      const appTitleMeta = document.querySelector('meta[name="apple-mobile-web-app-title"]');
      if (appTitleMeta) appTitleMeta.setAttribute('content', pwaTitle);
      const appNameMeta = document.querySelector('meta[name="application-name"]');
      if (appNameMeta) appNameMeta.setAttribute('content', pwaTitle);

      // Handle clean URL redirect for staff-login
      if ((isStaff && window.location.pathname === '/staff-login') || urlParams.get('portal') === 'staff') {
        if (!window.location.hash.includes('/staff-login')) {
          window.location.replace(window.location.origin + '/#/staff-login' + (window.location.search || ''));
        }
      }

      // Handle chunk load errors (common in SPAs when a new version is deployed)
      window.addEventListener('error', (e) => {
        if (e.message && (e.message.includes('chunk') || e.message.includes('Loading chunk'))) {
          console.warn('Chunk load error detected, reloading...', e);
          window.location.reload();
        }
      }, true);
    </script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
