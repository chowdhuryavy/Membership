    <!-- Web App Manifest -->
    <link rel="manifest" id="pwa-manifest" href="/manifest.json" />
    
    
    <script>
      // Handle clean URL redirect for staff-login
      const urlParams = new URLSearchParams(window.location.search);
      const isStaffPath = window.location.pathname === '/staff-login' || window.location.pathname.endsWith('/staff-login');
      const isStaffPortalParam = urlParams.get('portal') === 'staff';
      
      if (isStaffPath || isStaffPortalParam) {
        // Swap manifest for Staff Portal (Critical for iPhone)
        const manifestLink = document.getElementById('pwa-manifest');
        if (manifestLink) {
          manifestLink.setAttribute('href', '/manifest-staff.json');
        }
        
        // Only redirect if we are not already on the hash route
        if (!window.location.hash.includes('/staff-login')) {
          window.location.replace(window.location.origin + '/#/staff-login' + (window.location.search || ''));
        }
      }

      // Handle chunk load errors (common in SPAs when a new version is deployed)
      const originalConsoleError = console.error;
      console.error = function(...args) {
        if (args.some(arg => {
          if (!arg) return false;
          if (typeof arg === 'string') return arg.toLowerCase().includes('failed to fetch');
          if (arg instanceof Error) return arg.message && arg.message.toLowerCase().includes('failed to fetch');
          return false;
        })) {
          return; // Suppress
        }
        originalConsoleError.apply(console, args);
      };

      window.onerror = function(msg, url, line, col, error) {
        if (msg && msg.toString().toLowerCase().includes('failed to fetch')) return true;
        console.error("Window Error Caught:", msg, url, line, col, error);
      };
      window.addEventListener('error', (e) => {
        if (e.message && e.message.toLowerCase().includes('failed to fetch')) {
            e.preventDefault();
            return;
        }
        if (e.message !== 'Script error.') {
            console.error("Global Error Caught:", e.message, e.filename, e.lineno, e.colno, e.error);
        }
        if (e.message && (e.message.includes('chunk') || e.message.includes('Loading chunk'))) {
          console.warn('Chunk load error detected, reloading...', e);
          window.location.reload();
        }
      }, true);
      window.addEventListener('unhandledrejection', (e) => {
        if (e.reason && e.reason.message && e.reason.message.toLowerCase().includes('failed to fetch')) {
            e.preventDefault();
            return;
        }
        console.error("Unhandled Rejection:", e.reason);
      });

      // Clear Service Worker and cache storage in dev/preview environments to prevent "@vitejs/plugin-react can't detect preamble" errors
      if (window.location.hostname === 'localhost' || window.location.hostname.includes('-dev-') || window.location.hostname.includes('-pre-') || window.location.hostname.includes('127.0.0.1')) {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then((registrations) => {
            for (let registration of registrations) {
              registration.unregister().then((success) => {
                if (success) {
                  console.log('Dev Service Worker unregistered successfully.');
                  // Reload once to ensure a clean state without SW interception
                  window.location.reload();
                }
              });
            }
          });
        }
        if ('caches' in window) {
          caches.keys().then((names) => {
            for (let name of names) {
              caches.delete(name);
              console.log('Cleared dev cache:', name);
            }
          });
        }
      }
    </script>
