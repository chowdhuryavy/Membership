    <!-- Favicon Tags -->

    <!-- Apple Mobile Web App Metadata -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <meta name="apple-mobile-web-app-capable" content="yes">

    <meta name="theme-color" content="#4f46e5" />
    
    <script>
      // Handle clean URL redirect for staff-login
      const urlParams = new URLSearchParams(window.location.search);
      const isStaffPath = window.location.pathname === '/staff-login' || window.location.pathname.endsWith('/staff-login');
      const isStaffPortalParam = urlParams.get('portal') === 'staff';
      
      if (isStaffPath || isStaffPortalParam) {
        // Swap manifest for Staff Portal (Critical for iPhone)
        const manifestLink = document.querySelector('link[rel="manifest"]');
        if (manifestLink) {
          manifestLink.setAttribute('href', '/manifest-staff.json');
        }
        
        // Only redirect if we are not already on the hash route
        if (!window.location.hash.includes('/staff-login')) {
          window.location.replace(window.location.origin + '/#/staff-login' + (window.location.search || ''));
        }
      }

      // Handle chunk load errors (common in SPAs when a new version is deployed)
      window.addEventListener('error', (e) => {
        if (e.message && (e.message.includes('chunk') || e.message.includes('Loading chunk'))) {
          console.warn('Chunk load error detected, reloading...', e);
          window.location.reload();
        }
      }, true);
    </script>
</head>
